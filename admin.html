<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { max-width: 800px; }
  </style>
</head>
<body>
  <div class="navbar">
    <span>Contribution Tracker - Admin</span>
    <button onclick="logout()">Logout</button>
  </div>

  <h2>Admin Dashboard</h2>
  <select id="filterStatus" onchange="loadAllSubmissions()">
    <option value="All">All</option>
    <option value="Pending">Pending</option>
    <option value="Approved">Approved</option>
    <option value="Rejected">Rejected</option>
  </select>

  <table border="1" id="submissionsTable">
    <thead>
      <tr><th>Name</th><th>Role</th><th>Category</th><th>Title</th><th>Status</th><th>Action</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script type="module" src="app.js"></script>
</body>
</html>
