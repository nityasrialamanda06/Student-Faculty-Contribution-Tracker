<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <span>Contribution Tracker - Admin</span>
    <button onclick="window.location.href='reports.html'">View Analytics & Reports</button>
    <button onclick="logout()">Logout</button>
  </div>

  <h2>Admin Dashboard</h2>

  <div style="display:flex; gap:15px; margin-bottom:20px; flex-wrap:wrap;">
    <div style="background:white; padding:15px; border-radius:8px; text-align:center; flex:1; min-width:120px;">
      <div id="totalCount" style="font-size:24px; font-weight:bold;">0</div>
      <div>Total</div>
    </div>
    <div style="background:#fdf3d1; padding:15px; border-radius:8px; text-align:center; flex:1; min-width:120px;">
      <div id="pendingCount" style="font-size:24px; font-weight:bold;">0</div>
      <div>Pending</div>
    </div>
    <div style="background:#d4f3e0; padding:15px; border-radius:8px; text-align:center; flex:1; min-width:120px;">
      <div id="approvedCount" style="font-size:24px; font-weight:bold;">0</div>
      <div>Approved</div>
    </div>
    <div style="background:#f9d6d6; padding:15px; border-radius:8px; text-align:center; flex:1; min-width:120px;">
      <div id="rejectedCount" style="font-size:24px; font-weight:bold;">0</div>
      <div>Rejected</div>
    </div>
  </div>

  <label>Filter by status:</label>
  <select id="filterStatus" onchange="loadAllSubmissions()">
    <option value="All">All</option>
    <option value="Pending">Pending</option>
    <option value="Approved">Approved</option>
    <option value="Rejected">Rejected</option>
  </select>

  <label>Filter by category:</label>
  <select id="filterCategory" onchange="loadAllSubmissions()">
    <option value="All">All Categories</option>
    <option value="Publication">Publication</option>
    <option value="Certification">Certification</option>
    <option value="Internship">Internship</option>
    <option value="Hackathon">Hackathon</option>
    <option value="Patent">Patent</option>
    <option value="Sports">Sports</option>
    <option value="Cultural">Cultural</option>
    <option value="Other">Other</option>
  </select>

  <label>Filter by role:</label>
  <select id="filterRole" onchange="loadAllSubmissions()">
    <option value="All">All Roles</option>
    <option value="student">Student</option>
    <option value="faculty">Faculty</option>
  </select>

  <label>Filter by department:</label>
  <select id="filterDept" onchange="loadAllSubmissions()">
    <option value="All">All Departments</option>
    <option value="Computer Science">Computer Science</option>
    <option value="Electronics">Electronics</option>
    <option value="Mechanical">Mechanical</option>
  </select>

  <label>Search by name:</label>
  <input type="text" id="searchName" oninput="loadAllSubmissions()" placeholder="Type a name...">

  <div class="table-wrapper">
    <table border="1" id="submissionsTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Department</th>
          <th>Category</th>
          <th>Title</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <button onclick="exportPDF()">Export PDF</button>
  <button onclick="exportExcel()">Export Excel</button>

  <script type="module" src="app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>
</html>
