<!DOCTYPE html>
<html>
<head>
  <title>Faculty Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <span>Contribution Tracker - Faculty</span>
    <button onclick="logout()">Logout</button>
  </div>

  <h2>Submit New Achievement</h2>

  <div class="form-card" style="max-width:500px; margin-bottom:24px;">
    <input type="text" id="title" placeholder="Title">
    <select id="category">
      <option>Publication</option>
      <option>Certification</option>
      <option>Internship</option>
      <option>Hackathon</option>
      <option>Patent</option>
      <option>Sports</option>
      <option>Cultural</option>
      <option>Other</option>
    </select>
    <textarea id="description" placeholder="Description" rows="4"></textarea>
    <input type="date" id="date">
    <input type="text" id="proof" placeholder="Proof link (Drive/GitHub URL)">
    <button onclick="submitAchievement()">Submit</button>
  </div>

  <h2>My Submissions</h2>
  <div id="mySubmissions"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
