<!DOCTYPE html>
<html>
<head>
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <span>Contribution Tracker</span>
    <button onclick="logout()">Logout</button>
  </div>

  <h2>Welcome, Student</h2>
  <h3>Submit New Achievement</h3>

  <input type="text" id="title" placeholder="Title" required><br>

  <select id="category">
    <option>Publication</option>
    <option>Certification</option>
    <option>Internship</option>
    <option>Hackathon</option>
    <option>Patent</option>
    <option>Sports</option>
    <option>Cultural</option>
    <option>Other</option>
  </select><br>

  <textarea id="description" placeholder="Description" required></textarea><br>

  <input type="date" id="date" required><br>

  <input type="text" id="proof" placeholder="Proof link (Drive/Github URL)" required><br>

  <button onclick="submitAchievement()">Submit</button>

  <h3>My Submissions</h3>
  <div id="mySubmissions">Loading...</div>

  <script type="module" src="app.js"></script>
</body>
</html>
